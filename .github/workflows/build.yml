name: Build APK + AAB

on:
  push:
  workflow_dispatch:

# El token del workflow solo puede leer el repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Acciones fijadas a commits concretos (no a etiquetas que pueden moverse)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # Comprueba que gradle-wrapper.jar es el oficial antes de ejecutarlo
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Compilar APK (sin firmar)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      # La clave viene de los "secrets" del repositorio, nunca del código:
      #   TUMBADA_KEYSTORE_B64   el .p12 en base64  (base64 -w0 tumbada-firma.p12)
      #   TUMBADA_KEYSTORE_PASS  su contraseña
      - name: Firmar con la clave de release
        env:
          KS_B64: ${{ secrets.TUMBADA_KEYSTORE_B64 }}
          TUMBADA_KEYSTORE_PASS: ${{ secrets.TUMBADA_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$TUMBADA_KEYSTORE_PASS" ]; then
            echo "::error::Faltan los secrets TUMBADA_KEYSTORE_B64 / TUMBADA_KEYSTORE_PASS"; exit 1
          fi
          export TUMBADA_KEYSTORE="$RUNNER_TEMP/tumbada-firma.p12"
          echo "$KS_B64" | base64 -d > "$TUMBADA_KEYSTORE"
          chmod +x scripts/firmar-apk.sh
          scripts/firmar-apk.sh app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/Tumbada.apk"
          rm -f "$TUMBADA_KEYSTORE"

      # AAB para Google Play, firmado con la clave de SUBIDA (opcional: solo si existen los secrets)
      #   MRS_UPLOAD_KEYSTORE_B64   subida.p12 en base64
      #   MRS_UPLOAD_KEYSTORE_PASS  su contraseña
      - name: Firmar AAB con la clave de subida
        env:
          KS_B64: ${{ secrets.MRS_UPLOAD_KEYSTORE_B64 }}
          MRS_UPLOAD_KEYSTORE_PASS: ${{ secrets.MRS_UPLOAD_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$MRS_UPLOAD_KEYSTORE_PASS" ]; then
            echo "Sin clave de subida: no se genera el AAB firmado"; exit 0
          fi
          export MRS_UPLOAD_KEYSTORE="$RUNNER_TEMP/subida.p12"
          echo "$KS_B64" | base64 -d > "$MRS_UPLOAD_KEYSTORE"
          chmod +x scripts/firmar-aab.sh
          scripts/firmar-aab.sh app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/MyRideStats.aab"
          rm -f "$MRS_UPLOAD_KEYSTORE"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myridestats
          path: |
            ${{ runner.temp }}/Tumbada.apk
            ${{ runner.temp }}/MyRideStats.aab
          if-no-files-found: warn
